<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pro Scientific Calculator - Saad Ayub</title>
</head>
<body>
    <div class="calculator">
        <input type="text" id="inputbox" placeholder="0" readonly>
        
        <div class="row">
            <button class="sci-btn" id="h-btn">H</button>
            <button class="sci-btn">sin</button>
            <button class="sci-btn">cos</button>
            <button class="sci-btn">tan</button>
        </div>

        <div class="row">
            <button class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
        </div>
        <div class="row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>
        <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>
        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
        </div>
        <div class="row">
            <button>0</button>
            <button>00</button>
            <button>.</button>
            <button class="equalbtn">=</button>
        </div>

        <div id="history-overlay" class="hidden">
            <div class="history-header">
                <h3>History</h3>
                <button id="close-history">×</button>
            </div>
            <div id="history-list"></div>
            <button id="clear-history">Clear History</button>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
